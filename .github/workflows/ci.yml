name: Sovereign Governance & CI Pipeline

on:
  push:
    branches: [main, 'wo/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  governance-and-verification:
    name: Architecture, Security & Synthetic Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Verify Permanent Doctrine Text Presence
        run: |
          grep -rn "Sovereign will never be the doctor" docs/ AGENTS.md README.md
          grep -rn "model is not the system of record" docs/ AGENTS.md README.md

      - name: Gitleaks Secret & PHI Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Synthetic Data & PHI Verification
        run: pnpm run test:phi

      - name: Architectural Boundary Verification
        run: pnpm run test:arch

      - name: Vitest Unit & Architectural Tests
        run: pnpm run test
