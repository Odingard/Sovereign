name: Sovereign Governance & CI Pipeline

on:
  push:
    branches: [main, 'wo/**', 'fix/**', 'docs/**', 'web/**']
  pull_request:
    branches: [main]

jobs:
  governance-and-verification:
    name: Architecture, Security & Synthetic Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sovereign_test
          POSTGRES_USER: sovereign_dev
          POSTGRES_PASSWORD: sovereign_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        # WO-002A S1-01 / G-07: the lockfile is authoritative. A CI run that is
        # permitted to resolve a different dependency graph than the one reviewed
        # is not a supply-chain gate.
        run: pnpm install --frozen-lockfile

      # WO-002A S1-01 / PR-A2, closing G-33. STAGE1_FOUNDATION_SPEC.md §9.1 requires
      # `biome check` and `tsc --noEmit` in CI. Both are blocking from this commit on:
      # a reporting-only gate is not a gate.
      - name: Lint (Biome)
        run: pnpm run lint

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Verify Permanent Doctrine Text Presence
        run: |
          grep -rn "Sovereign will never be the doctor" docs/ AGENTS.md README.md
          grep -rn "model is not the system of record" docs/ AGENTS.md README.md

      - name: Install Gitleaks CLI
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks Secret & PHI Scan
        run: gitleaks detect --config=.gitleaks.toml --verbose --redact

      - name: Sovereign Automated Verification
        run: pnpm run verify
        env:
          SOVEREIGN_DATABASE_URL: postgresql://sovereign_dev:sovereign_dev_password@localhost:5432/sovereign_test

      - name: Install marketing browser
        run: pnpm --filter @sovereign/marketing-site exec playwright install --with-deps chromium

      - name: Verify marketing routes and responsive experience
        run: pnpm --filter @sovereign/marketing-site test:browser

      - name: Upload marketing visual QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketing-visual-qa
          path: |
            test-results/marketing-browser/screenshots
            playwright-report
          if-no-files-found: warn
