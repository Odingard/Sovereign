name: Security & Supply Chain Gates

# WO-002A AC-05/06/07. Runs alongside ci.yml. Every job here is intended to become a
# required check on `main` once branch protection is configured (WO-002A AC-09).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # nightly SCA re-scan of main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write # cosign keyless / SLSA
  attestations: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.130.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep (OWASP + Sovereign tenancy rules)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config .semgrep/ \
            --error --severity ERROR --severity WARNING \
            --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: semgrep.sarif

  sca:
    name: SCA (pnpm audit + Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
          run_install: false
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  iac:
    name: IaC policy-as-code (Checkov + Conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkov (Terraform)
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12
        with:
          directory: infra/
          framework: terraform
          soft_fail: false
          quiet: true
      - name: Install Conftest
        run: curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar -xz -C /tmp

      - name: Conftest — Rego unit tests
        run: /tmp/conftest verify --policy infra/policy

      # G-34: every rule reads `input.resource_changes`, which exists only in
      # `terraform show -json <plan>` output. The previous step ran conftest against
      # `infra/envs/*` .tf SOURCE, so no rule could ever match and the gate exited 0 —
      # a policy gate that structurally could not fail. Fixtures are plan JSON.
      - name: Conftest — compliant plan must PASS
        run: /tmp/conftest test infra/policy/fixtures/compliant-plan.json --policy infra/policy --all-namespaces

      # AC-002A-05: "Conftest/Checkov gates fail a deliberately non-compliant plan."
      # The inverted exit code is the point. A gate that cannot fail is not a gate.
      - name: Conftest — every non-compliant plan must FAIL
        run: |
          status=0
          for f in infra/policy/fixtures/noncompliant/*.json; do
            if /tmp/conftest test "$f" --policy infra/policy --all-namespaces >/dev/null 2>&1; then
              echo "::error file=$f::NEGATIVE TEST FAILED TO FAIL — this non-compliant plan was accepted by policy"
              status=1
            else
              echo "ok — correctly denied: $f"
            fi
          done
          exit $status

  sbom-provenance:
    name: SBOM + signed provenance
    runs-on: ubuntu-latest
    needs: [sast, sca, iac]
    # G-36 / audit A-1: GitHub treats a SKIPPED required check as SATISFIED for branch
    # protection. With a bare `needs:`, any upstream gate failure silently satisfied
    # this one. Run always and fail explicitly instead.
    if: always()
    steps:
      - name: Refuse to sign unscanned code
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Upstream security gate did not pass (sast=${{ needs.sast.result }}, sca=${{ needs.sca.result }}, iac=${{ needs.iac.result }}). Refusing to emit an SBOM or provenance attestation for unscanned code."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM (CycloneDX + SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sovereign-sbom.cdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: sovereign-sbom.spdx.json
      - name: Attest SBOM provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "**/sovereign-sbom.*.json"

  dast:
    name: DAST (ZAP baseline)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve preview target
        id: target
        run: |
          # WO-002A AC-07: replace with the ephemeral preview URL published by deploy-preview.yml.
          echo "url=${PREVIEW_URL:-}" >> "$GITHUB_OUTPUT"
        env:
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
      - name: ZAP baseline
        if: steps.target.outputs.url != ''
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          fail_action: true
          cmd_options: "-a -I"
      # G-35: this step previously ended `&& exit 0`, so the DAST gate reported SUCCESS
      # on every run while never scanning anything. AC-002A-07 requires DAST on a PR
      # preview; until deploy-preview.yml publishes PREVIEW_URL (G-37), the truthful
      # result is failure, not success. This check is deliberately NOT in the required
      # set on `main` until AC-002A-07 lands.
      - name: No preview target — DAST did not run
        if: steps.target.outputs.url == ''
        run: |
          echo "::error::PREVIEW_URL is not set, so no DAST scan was performed. AC-002A-07 is unmet (gaps G-35, G-37). This gate reports failure rather than claiming a scan it did not run."
          exit 1
