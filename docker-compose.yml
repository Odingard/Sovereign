services:
  postgres:
    image: postgres:16-alpine
    container_name: sovereign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sovereign_dev
      POSTGRES_PASSWORD: sovereign_dev_password
      POSTGRES_DB: sovereign_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign_dev -d sovereign_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: sovereign-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=sovereign_dev
      - POSTGRES_PWD=sovereign_dev_password
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.26.1
    container_name: sovereign-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  # Local IdP (WO-002B S1-08, ADR-0012 §2). Keycloak here, Cloud Identity Platform in
  # cloud environments — the OIDC adapter implements both from day one, which is how
  # we find out whether the port is real. Synthetic users only; never deployed.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sovereign-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=synthetic-local-only
      - KC_HEALTH_ENABLED=true
    ports:
      - "8081:8081"
    volumes:
      - ./infra/local/keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres_data:
